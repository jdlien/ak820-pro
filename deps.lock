# AK820 Pro — pinned build dependencies.
#
# setup.sh clones each of these and REFUSES TO CONTINUE if a clone's HEAD does
# not match the sha here. Pins are commits, never patch files: hand-applied
# diffs are what phase 0 of the hardening project abolished, because a single
# `git submodule update` silently destroyed them and the resulting binary
# looked fine.
#
# Format:  name  url  branch  sha
# Lines starting with # and blank lines are ignored.
#
# To move a pin: update the sha here, re-run ./setup.sh, rebuild, re-verify on
# hardware. Do not edit a clone in place and leave this file behind -- that is
# the silently-wrong-binary failure mode build.sh exists to catch.

# The firmware. Carries keyboards/a_jazz/ak820pro/ plus twelve core files
# (drivers/led/sn32f2xx.c+.h, quantum/rgb_matrix/rgb_matrix.c+.h and the two
# animations that call its speed hooks, platforms/chibios/.../wear_leveling_efl.c,
# drivers/encoder/encoder_quadrature.c, quantum/encoder.c+.h,
# quantum/action_tapping.c+.h) -- all weak-hooked, no-op or additive for other
# boards.
# Everything else in the tree is upstream QMK.
qmk_firmware-ak820pro  https://github.com/jdlien/qmk_firmware.git  ak820pro-jdlien  ce3f842de25ae100f62106a326b10fe6be67f005

# ak820ctl (clock + flash provisioning) and the asset pipeline (mkraw.py,
# mkanim.py). MUST be this fork's branch, not fpb/main: main has no --bias
# support, which the timekeeper agent drives, and the failure is silent.
time-util-ak820pro  https://github.com/jdlien/time-util-ak820pro.git  ak820pro-local  7b8242a4b4f51ee0f094dc3f3c6ff382715ddbcc

# The flasher. fpb's fork, NOT SonixQMK/main: main fails on macOS Tahoe while
# looking identical. Must be built USE_LIBUSB=1 -- a plain build also looks
# identical and also fails. See docs/hardware.md.
SonixFlasherC  https://github.com/fpb/SonixFlasherC.git  fix_for_macos_tahoe  661431ebb61333436bebed4c2e2c7e56841c4a67

# NOT CLONED HERE, recorded for reference: lib/chibios-contrib is a submodule of
# the firmware repo, pinned by its gitlink and carrying the ChibiOS patches as
# commits (see keyboards/a_jazz/ak820pro/PATCHES.md). setup.sh
# initializes it via `make git-submodule`; build.sh enforces gitlink == HEAD.
#   https://github.com/jdlien/ChibiOS-Contrib.git  ak820pro-patches  5a1674e905a8e429746345ce5d971735895d2fe8
