# A tag `v*` becomes a GitHub Release carrying the agent zip and its sha256
# sums. The firmware artifacts for the same tag are uploaded afterwards by
# `scripts/release-firmware.sh <tag>` from a checkout at the tag: the pinned
# MSYS2 toolchain in deps.lock is not something to reproduce on a runner, and
# the repo's reproducible-build habit -- clean builds of one commit hashing
# identically -- is the check that matters there. That script refuses a dirty
# clone, an unpinned commit, or a -dirty artifact.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ak820-agent
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: package
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = "ak820-agent-$tag-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\ak820.exe, target\release\ak820-agent.exe, INSTALL.txt $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force
          $sums = Get-FileHash -Algorithm SHA256 "$dir.zip", "$dir\ak820.exe", "$dir\ak820-agent.exe" |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path -Leaf $_.Path) }
          # LF, not CRLF: `sha256sum -c` in Git Bash and on macOS chokes on a
          # carriage return in every filename (v0.1.0 shipped that way and was
          # re-uploaded by hand).
          [IO.File]::WriteAllText("sha256sums.txt", ($sums -join "`n") + "`n")
          Get-Content sha256sums.txt
          .\target\release\ak820.exe --version
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "ak820-agent-$tag-windows-x64.zip" sha256sums.txt `
            --title $tag --generate-notes --verify-tag
