# The power page (site/power/, plans/POWER-CHARTS-PLAN.md): checks that the
# committed power.json is what deps.lock's firmware generates (a difference in
# the sha alone warns and publishes a fresh build), checks
# that model.js matches the firmware's own C exactly (the oracle) and
# reproduces the plan's figures; then, on main, publishes site/ alone to
# GitHub Pages (https://jdlien.github.io/ak820-pro/power/). Pull requests run
# the checks only.
name: power-page

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/power_model.py"
      - "scripts/power_oracle.c"
      - "scripts/power_evidence.json"
      - "deps.lock"
      - "history/power-bench-*/**"
      - ".github/workflows/power-page.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/power_model.py"
      - "scripts/power_oracle.c"
      - "scripts/power_evidence.json"
      - "deps.lock"
      - "history/power-bench-*/**"
      - ".github/workflows/power-page.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push supersedes a queued one, never a running one.
concurrency:
  group: power-page-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The firmware clone is gitignored and the generator only reads a few
      # files at the pinned commit, so fetch that one commit, no submodules,
      # no build.
      - name: Fetch the pinned firmware commit
        run: |
          read -r _ url _ sha < <(grep '^qmk_firmware-ak820pro ' deps.lock)
          git init -q qmk_firmware-ak820pro
          git -C qmk_firmware-ak820pro remote add origin "$url"
          git -C qmk_firmware-ak820pro fetch -q --depth 1 --filter=blob:none origin "$sha"
          git -C qmk_firmware-ak820pro cat-file -e "$sha^{commit}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # power.json is generated from the pin. A pin that moves nothing the
      # page reads differs from the committed copy in the firmware's sha alone
      # (--check exits 3): a warning, and the job tests and publishes a fresh
      # build. Any other difference fails, so a moved figure is reviewed and
      # committed before it is published (the tests pin only some figures).
      - name: power.json from the pinned firmware
        run: |
          rc=0
          python3 scripts/power_model.py --check || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::warning file=site/power/power.json::differs from the pinned firmware's build in the sha alone; publishing a fresh build (commit scripts/power_model.py's output)"
            python3 scripts/power_model.py
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi

      - name: model.js against the oracle and the plan
        run: node --test site/power/model.test.js

      - name: Package site/ for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}power/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
