# The power page (site/power/, plans/POWER-CHARTS-PLAN.md): builds power.json
# from deps.lock's firmware (warning when the committed copy differs), checks
# that model.js matches the firmware's own C exactly (the oracle) and
# reproduces the plan's figures; then, on main, publishes site/ alone to
# GitHub Pages (https://jdlien.github.io/ak820-pro/power/). Pull requests run
# the checks only.
name: power-page

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/power_model.py"
      - "scripts/power_oracle.c"
      - "scripts/power_evidence.json"
      - "deps.lock"
      - "history/power-bench-*/**"
      - ".github/workflows/power-page.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/power_model.py"
      - "scripts/power_oracle.c"
      - "scripts/power_evidence.json"
      - "deps.lock"
      - "history/power-bench-*/**"
      - ".github/workflows/power-page.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push supersedes a queued one, never a running one.
concurrency:
  group: power-page-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The firmware clone is gitignored and the generator only reads a few
      # files at the pinned commit, so fetch that one commit, no submodules,
      # no build.
      - name: Fetch the pinned firmware commit
        run: |
          read -r _ url _ sha < <(grep '^qmk_firmware-ak820pro ' deps.lock)
          git init -q qmk_firmware-ak820pro
          git -C qmk_firmware-ak820pro remote add origin "$url"
          git -C qmk_firmware-ak820pro fetch -q --depth 1 --filter=blob:none origin "$sha"
          git -C qmk_firmware-ak820pro cat-file -e "$sha^{commit}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # power.json is generated from the pin. A pin that moved nothing but its
      # sha used to fail here on the committed copy's sha alone, so the
      # committed copy is now a warning and the job tests and publishes a
      # fresh build. The tests pin the plan's figures, so a pin that moves a
      # number still fails, as v0.4.0's brightness curve did.
      - name: power.json from the pinned firmware
        run: |
          if ! python3 scripts/power_model.py --check; then
            echo "::warning file=site/power/power.json::not what the pinned firmware generates; testing and publishing a fresh build (commit scripts/power_model.py's output)"
          fi
          python3 scripts/power_model.py

      - name: model.js against the oracle and the plan
        run: node --test site/power/model.test.js

      - name: Package site/ for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}power/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
